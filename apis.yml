name: One Robot
description: >-
  One Robot is a San Francisco-based Y Combinator (Winter 2026) startup building
  world-model-based simulation environments for robotics teams. Its core product
  learns physics and visual appearance directly from real robot data, producing
  simulation environments that are both visually and physically realistic so teams
  can train and evaluate robot manipulation policies without excessive reliance on
  physical robot time and real-world data collection. One Robot specializes in
  contact-rich manipulation, deformable objects (such as textile and box folding),
  and precise assembly tasks. As an early-stage two-person company it currently
  offers task-specific simulation collaboration rather than a public developer
  platform or API; this profile tracks the company in the API Evangelist network
  for future enrichment as any developer surface emerges.
